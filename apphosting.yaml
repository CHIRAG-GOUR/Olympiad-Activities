# ==============================================================================
# FIREBASE APP HOSTING CONFIGURATION - OLYMPIAD PLATFORM
# ==============================================================================
# Configures Next.js 15 App Router dynamic SSR, Cloud Run compute, and environment
# ==============================================================================

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
  - variable: NEXT_PUBLIC_DATA_PROVIDER
    value: firebase
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: olympiad-dashboard.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: olympiad-dashboard
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_ID
    value: olympiad
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: olympiad-dashboard.firebasestorage.app
