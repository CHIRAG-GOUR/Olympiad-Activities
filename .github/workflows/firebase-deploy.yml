name: Deploy Olympiad Activities to Firebase Hosting

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Checks
        run: |
          npm run verify:shapes
          npm run verify:imo6a
          npm run verify:imo6p3

      - name: Build Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_DATA_PROVIDER: local
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: olympiad-dashboard
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: olympiad
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: olympiad-dashboard.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: olympiad-dashboard.firebasestorage.app

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:the-olympiad-dashboard --project olympiad-dashboard --token "${{ secrets.FIREBASE_TOKEN }}"
